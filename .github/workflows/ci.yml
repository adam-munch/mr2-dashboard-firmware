name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build

      - name: Build (Debug)
        run: |
          cmake --preset debug -DCMAKE_C_FLAGS=-Werror
          cmake --build --preset debug

      - name: Build (Release)
        run: |
          cmake --preset release -DCMAKE_C_FLAGS=-Werror
          cmake --build --preset release

      - uses: actions/upload-artifact@v4
        with:
          name: mr2-dashboard-firmware
          path: |
            build/release/mr2-dashboard.elf
            build/release/mr2-dashboard.hex
            build/release/mr2-dashboard.bin
            build/release/mr2-dashboard.map

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build and run tests
        run: |
          cmake -S tests -B build-tests -G Ninja
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure
